spring.application.name=wallet-service
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:wallet_user}
spring.datasource.password=${DB_PASSWORD:wallet123}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Secret must be at least 32 characters. For real use, set the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration-ms=3600000
